  </tr>
  <tr>

      <table width="600" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr>
        <td width="291" style="padding:0;font-size:0;line-height:0;"><a href="mailto:partnership@nxtfluencez.com" target="_blank"><img src="https://raw.githubusercontent.com/chandrakishoresingh640-alt/nxtfluencez-email-assets/main/sig-built/sig-v4-email.png" width="291" height="40" alt="partnership@nxtfluencez.com" border="0" style="display:block;border:0;"></a></td>

      </tr></table>

  </tr>
  <tr>
    <td style="padding:0;font-size:0;line-height:0;"><a href="tel:+13473716560" target="_blank"><img src="https://raw.githubusercontent.com/chandrakishoresingh640-alt/nxtfluencez-email-assets/main/sig-built/sig-v4-phone.png" width="600" height="40" alt="+1 (347) 371-6560" border="0" style="display:block;border:0;"></a></td>
  </tr>
  <tr>
    <td style="padding:0;font-size:0;line-height:0;">
      <table width="600" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr>

<div style="margin:16px 0;font-family:sans-serif;">
  <button id="copy-btn" style="padding:10px 18px;font-size:16px;cursor:pointer;">Copy signature</button>
  <span id="copy-status" style="margin-left:12px;font-size:14px;"></span>
</div>
<script>
document.getElementById('copy-btn').addEventListener('click', async () => {
  const html = document.getElementById('sig-card').outerHTML;
  const status = document.getElementById('copy-status');
  try {
    await navigator.clipboard.write([
      new ClipboardItem({
        'text/html': new Blob([html], {type: 'text/html'}),
        'text/plain': new Blob(['Nxtfluencez - Shashank Singh, Influencer Marketing Executive'], {type: 'text/plain'})
      })
    ]);
    status.textContent = 'Copied! Now paste into Gmail.';
  } catch (e) {
    status.textContent = 'Copy failed: ' + e;
  }
});
</script>
</body>
</html>
